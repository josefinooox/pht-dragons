name: Fetch data, build, deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 30 min (UTC). Public repo = unlimited free minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the data snapshot
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fetch data from HMS
        run: npm run fetch
        env:
          TZ: Europe/Prague

      - name: Commit data snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/logos
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update snapshot [skip ci]"
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          TZ: Europe/Prague
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
